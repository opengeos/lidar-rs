name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (default features)
        run: cargo test --workspace
      - name: Test (no default features)
        run: cargo test -p lidar --no-default-features --lib
      - name: Test (all features)
        run: cargo test --workspace --all-features

  python:
    name: Python bindings (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: python
      - name: Verify Python license files and version parity
        run: |
          diff -u LICENSE python/LICENSE
          diff -u NOTICE python/NOTICE
          python -c '
          import pathlib, tomllib
          root_v = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          py_v = tomllib.loads(pathlib.Path("python/Cargo.toml").read_text())["package"]["version"]
          assert root_v == py_v, f"version mismatch: root={root_v} vs python={py_v}"
          '
      - name: Format check (python)
        run: cargo fmt --manifest-path python/Cargo.toml -- --check
      - name: Clippy (python)
        run: cargo clippy --manifest-path python/Cargo.toml --all-targets -- -D warnings
      - name: Build, lint, and test Python package
        working-directory: python
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest numpy ruff
          ruff check python tests
          maturin develop --release
          pytest -v

  wasm:
    name: WebAssembly (lidar-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: js
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-pack@0.15.1
      - name: Verify JS NOTICE parity
        run: diff -u NOTICE js/NOTICE
      - name: Format check (js)
        run: cargo fmt --manifest-path js/Cargo.toml -- --check
      - name: Clippy (wasm32)
        run: cargo clippy --manifest-path js/Cargo.toml --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Check Playground JS syntax
        run: |
          node --check docs/javascripts/playground.js
          node --check docs/javascripts/playground-worker.js
      - name: Build and test Node.js WASM bundle
        working-directory: js
        run: |
          wasm-pack build --target nodejs --release --out-dir pkg-node -- --locked
          node test.mjs
      - name: Build browser and bundler WASM bundles
        working-directory: js
        run: |
          wasm-pack build --target web --release --out-dir pkg -- --locked
          wasm-pack build --target bundler --release --out-dir pkg-bundler -- --locked

  audit:
    name: Security audit (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit
      - name: Audit lockfiles (with .cargo/audit.toml exceptions)
        run: |
          cargo audit
          cargo audit --no-fetch --file js/Cargo.lock
      - name: Verify ignored advisories match exact upstream crates and versions
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          for lock in Cargo.lock js/Cargo.lock; do
            report=$(cargo audit --no-fetch --json --file "$GITHUB_WORKSPACE/$lock" || true)
            unexpected=$(printf '%s' "$report" | jq -c '[
              .vulnerabilities.list[]
              | {id: .advisory.id, pkg: .package.name, ver: .package.version}
              | select(
                  ((.pkg == "ruzstd" and .ver == "0.8.3") and (.id == "RUSTSEC-2026-0344"))
                  or
                  ((.pkg == "zip" and .ver == "8.6.0") and (
                    .id == "RUSTSEC-2026-0367" or
                    .id == "RUSTSEC-2026-0368" or
                    .id == "RUSTSEC-2026-0369" or
                    .id == "RUSTSEC-2026-0429" or
                    .id == "RUSTSEC-2026-0545" or
                    .id == "RUSTSEC-2026-0546" or
                    .id == "RUSTSEC-2026-0547" or
                    .id == "RUSTSEC-2026-0548"
                  ))
                  | not
                )
            ]')
            if [ "$unexpected" != "[]" ]; then
              echo "Unexpected vulnerabilities in $lock: $unexpected" >&2
              exit 1
            fi
          done
