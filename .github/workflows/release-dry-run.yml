name: Release dry run

# Builds and verifies everything a release publishes, without uploading: cross-platform Python
# wheels + sdist, stripped CLI binaries, license file checks, `cargo publish --dry-run`, and
# `npm pack --dry-run` for `lidar-wasm`.
# Run manually before tagging a release (Actions -> Release dry run -> Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/release-build.yml

  crates:
    name: Dry-run cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Both crates in one invocation so Cargo verifies lidar-cli against the local lidar
      # package via its temporary registry even before this lidar version is published to crates.io.
      - name: Package and verify lidar and lidar-cli
        run: cargo publish --dry-run -p lidar -p lidar-cli

  npm:
    name: Dry-run npm pack (lidar-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: js
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-pack@0.15.1
      - name: Build, test, and dry-run pack lidar-wasm
        working-directory: js
        run: |
          npm run prepublishOnly
          npm pack --dry-run
