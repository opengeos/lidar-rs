name: Release

# On version tags (`v*`), publishes Python wheels + sdist (`lidar-rs`) to PyPI, publishes
# `lidar` and `lidar-cli` to crates.io, publishes `lidar-wasm` to npm, and attaches prebuilt
# CLI binaries to the GitHub Release. All three registries use OIDC trusted publishing via the
# `pypi`, `crates-io`, and `npm` GitHub environments (no long-lived API tokens stored in
# repository secrets).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag matches package versions
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag matches lidar, lidar-cli, and python/Cargo.toml versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          ws_meta=$(cargo metadata --no-deps --format-version 1)
          for crate in lidar lidar-cli; do
            have=$(echo "$ws_meta" | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            if [ "$want" != "$have" ]; then
              echo "::error::tag $TAG does not match $crate version $have"
              exit 1
            fi
          done
          py_have=$(cargo metadata --no-deps --format-version 1 --manifest-path python/Cargo.toml | jq -r '.packages[] | select(.name == "lidar-py") | .version')
          if [ "$want" != "$py_have" ]; then
            echo "::error::tag $TAG does not match python/Cargo.toml version $py_have"
            exit 1
          fi
          js_have=$(cargo metadata --no-deps --format-version 1 --manifest-path js/Cargo.toml | jq -r '.packages[] | select(.name == "lidar-js") | .version')
          if [ "$want" != "$js_have" ]; then
            echo "::error::tag $TAG does not match js/Cargo.toml version $js_have"
            exit 1
          fi
          npm_have=$(jq -r '.version' js/package.json)
          if [ "$want" != "$npm_have" ]; then
            echo "::error::tag $TAG does not match js/package.json version $npm_have"
            exit 1
          fi
          cff_have=$(sed -n 's/^version: *"\?\([^"]*\)"\?/\1/p' CITATION.cff | head -n 1)
          if [ "$want" != "$cff_have" ]; then
            echo "::error::tag $TAG does not match CITATION.cff version $cff_have"
            exit 1
          fi

  ci:
    uses: ./.github/workflows/ci.yml

  build:
    uses: ./.github/workflows/release-build.yml

  publish:
    name: Publish to PyPI
    needs: [verify, ci, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  crates:
    name: Publish to crates.io
    needs: [verify, ci]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
      # crates.io trusted publishing requires each crate to exist before configuring its
      # trusted publisher (owner: opengeos, repo: lidar-rs, workflow: release.yml,
      # environment: crates-io). Check upfront before authenticating.
      - name: Verify lidar and lidar-cli have been bootstrapped on crates.io
        run: |
          for crate in lidar lidar-cli; do
            if ! curl --fail --silent --show-error -A "lidar-rs release (https://github.com/opengeos/lidar-rs)" "https://crates.io/api/v1/crates/$crate" > /dev/null; then
              echo "::error::Publish $crate manually once (cargo publish -p $crate) and configure its crates.io trusted publisher (opengeos/lidar-rs, release.yml, environment crates-io) before tagging."
              exit 1
            fi
          done
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # Versions already on crates.io are skipped cleanly.
      - name: Publish lidar, then lidar-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          for crate in lidar lidar-cli; do
            version=$(echo "$metadata" | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')
            if curl -sf -A "lidar-rs release (https://github.com/opengeos/lidar-rs)" "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is already on crates.io"
            else
              cargo publish -p "$crate"
            fi
          done

  npm:
    name: Publish to npm
    needs: [verify, ci]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: js
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-pack@0.15.1
      # npm OIDC trusted publishing requires npm >= 11.5.1 and a Trusted Publisher configured on
      # npmjs.com for `lidar-wasm` (owner: opengeos, repo: lidar-rs, workflow: release.yml,
      # environment: npm). Versions already on npm are skipped cleanly.
      - name: Verify lidar-wasm has been bootstrapped on npm
        working-directory: js
        run: |
          name=$(jq -r '.name' package.json)
          if ! curl --fail --silent --show-error "https://registry.npmjs.org/${name}" > /dev/null; then
            echo "::error::Publish ${name} manually once (cd js && npm publish --access public) and configure its npm trusted publisher (opengeos/lidar-rs, release.yml, environment npm) before tagging."
            exit 1
          fi
      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: |
          if ! node -e 'const [a,b,c] = process.argv[1].split(".").map(Number); process.exit((a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)))) ? 0 : 1);' "$(npm --version)"; then
            npm install -g npm@11.11.0
          fi
          npm --version
      - name: Publish lidar-wasm to npm
        working-directory: js
        run: |
          set -euo pipefail
          name=$(jq -r '.name' package.json)
          version=$(jq -r '.version' package.json)
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name}/${version}")
          if [ "$status" = "200" ]; then
            echo "${name}@${version} is already on npm"
          elif [ "$status" = "404" ]; then
            dist_tag="latest"
            if [[ "$version" == *-* ]]; then
              dist_tag="next"
            fi
            npm publish --provenance --access public --tag "$dist_tag"
          else
            echo "::error::Unexpected HTTP ${status} checking https://registry.npmjs.org/${name}/${version}"
            exit 1
          fi

  github-release:
    name: Create GitHub Release
    needs: [build, publish, crates, npm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Attach CLI archives to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --verify-tag --generate-notes
          gh release upload "$tag" dist/lidar-cli-* --clobber
