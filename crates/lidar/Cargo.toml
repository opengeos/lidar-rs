[package]
name = "lidar"
description = "Pure-Rust port of opengeos/lidar for delineating nested surface depressions and mounts in DEMs using the level-set method, powered by terrio and richdem"
readme = "../../README.md"
keywords = ["gis", "lidar", "dem", "hydrology", "depressions"]
categories = ["science::geo", "algorithms"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["parallel", "pointcloud", "serde"]
## Multi-threaded parallelism via `rayon`
parallel = ["dep:rayon", "richdem/parallel"]
## LiDAR point cloud I/O, conversion, and DSM gridding via `terrio/pointcloud` (LAS, LAZ, COPC, PLY, E57)
pointcloud = ["terrio/pointcloud"]
## Serialization of depression and result structs via `serde`
serde = ["dep:serde", "dep:serde_json", "richdem/serde"]
## Opt-in U.S. federal data download utilities (USGS 3DEP, WBD, NHD, Transportation, USFWS NWI, NOAA Atlas 14; non-WASM only, pulls `ureq` with `rustls`/`ring`)
download = ["dep:ureq", "dep:serde", "dep:serde_json", "dep:tempfile"]

[dependencies]
gif.workspace = true
png.workspace = true
richdem.workspace = true
terrio.workspace = true
thiserror.workspace = true
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
