[package]
name = "lidar-js"
description = "WebAssembly bindings for lidar-rs: nested surface depression/mount delineation and inundation simulation in browsers and Node.js (zero GDAL)"
publish = false
version = "0.6.1"
edition = "2024"
# Compiled .wasm bundles richdem (GPL-3.0-only); lidar-rs source code itself is MIT.
license = "GPL-3.0-only"
rust-version = "1.90"
repository = "https://github.com/opengeos/lidar-rs"
authors = ["Qiusheng Wu <giswqs@gmail.com>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lidar = { path = "../crates/lidar", default-features = false, features = ["serde"] }
richdem = { version = "0.2", default-features = false, features = ["terrio", "serde"] }
terrio = { version = "0.9", default-features = false, features = ["geotiff"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
