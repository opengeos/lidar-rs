[package]
name = "lidar-py"
description = "Python bindings for lidar-rs (pure-Rust port of opengeos/lidar with terrio and richdem)"
publish = false
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/opengeos/lidar-rs"

[lib]
name = "_lidar_rs"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
lidar = { path = "../crates/lidar", features = ["parallel", "pointcloud", "serde"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
numpy = "0.29"
