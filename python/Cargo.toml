[package]
name = "lidar-py"
description = "Python bindings for lidar-rs (pure-Rust port of opengeos/lidar with terrio and richdem)"
publish = false
version = "0.6.2"
edition = "2024"
# Compiled wheel bundles richdem (GPL-3.0-only); lidar-rs source code itself is MIT.
license = "GPL-3.0-only"
rust-version = "1.90"
repository = "https://github.com/opengeos/lidar-rs"

[lib]
name = "_lidar_rs"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
lidar = { path = "../crates/lidar", features = ["parallel", "pointcloud", "serde", "download"] }
lidar-cli = { path = "../crates/lidar-cli", features = ["download"] }
terrio = { version = "0.9", default-features = false, features = ["pointcloud"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
numpy = "0.29"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
