[project]
site_name = "lidar-rs"
site_description = "Pure-Rust port of opengeos/lidar for delineating nested surface depressions and mounts in DEMs, powered by terrio and richdem"
site_author = "opengeos"
site_url = "https://lidar-rs.opengeos.org"
repo_url = "https://github.com/opengeos/lidar-rs"
repo_name = "opengeos/lidar-rs"
copyright = "lidar-rs is released under the MIT License. Ported from <a href=\"https://github.com/opengeos/lidar\">opengeos/lidar</a>; see <a href=\"https://github.com/opengeos/lidar-rs/blob/main/NOTICE\">NOTICE</a>."

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "CLI Reference" = "cli.md" },
  { "Rust Library" = "rust.md" },
  { "Python API" = "python.md" },
  { "Report Issues" = "https://github.com/opengeos/lidar-rs/issues" },
]

[project.theme]
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.footer",
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "deep orange"
toggle.icon = "material/toggle-switch-off-outline"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "deep orange"
toggle.icon = "material/toggle-switch"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
